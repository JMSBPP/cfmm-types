# types.toml — shared lib types under .spec/types/
# Pointer on modules: -- types.toml: <Name>

[Pips]
module = "Pips"
kind = "plain"
file = "types/Pips/Pips.md"
carriers = ["Pips", "PIPS"]
operations = ["intro"]
laws = [
  "intro(v1,v2) = Pips{ val: u16(mulDiv(v1,v2,PIPS)) }",
  "mulDiv(v1,v2,PIPS) ∉ u16 ⇒ revert (⊥)",
  "Eff = []",
]
refined = false
notes = """
#27 type/Pips. v1: intro takes untyped u256×u256 (IMPROVE → Ray × mag later).
PIPS = 1e6 Algebra FEE_DENOMINATOR. No Eff. No Weiner/Shock bodies.
Define: intro filled; Pips.btt success fit-u16 + overflow revert.
"""

[Ray]
module = "Ray"
kind = "plain"
file = "types/Ray/Ray.md"
carriers = ["Ray"]
operations = ["intro", "rayVal", "rayMulId", "rayAddId", "rayMax"]
laws = [
  "rayVal(intro(x)) = x",
  "rayMulId() = intro(RAY_UNIT)",
  "rayAddId() = intro(RAY_ZERO)",
  "rayMax() = intro(floor(U256_MAX / RAY_UNIT))",
  "RAY_UNIT = 10^27",
]
refined = false
notes = """
#28/#32 define/Ray. Numerics domain. intro/rayVal/rayMulId/rayAddId/rayMax filled.
Expansion/Contraction/scaleRay deferred. Independent of TimeSpacing sqrt_dt (#26).
No Eff. No Weiner bodies. BTT: RayIntro/MulId/AddId/Max.btt.
"""

[TimeSpacing]
module = "TimeSpacing"
kind = "dependent"
file = "types/TimeSpacing/TimeSpacing.md"
carriers = ["TimeSpacing(dt)", "Ray"]
operations = ["intro", "n", "sqrt_dt"]
laws = [
  "TimeSpacing(dt) total iff dt ∈ {2,3,4,5,6,8,9,10} ∧ N=Window/dt ∈ ℕ ∧ M·dt > Window",
  "sqrt_dt(TimeSpacing(dt)) = floor(√dt · RAY)  (comptime SQRT_DT_RAY_* table)",
]
refined = false
notes = """
Domain RealizedVolatility (#26). Ray (#28/#32) available on develop.
Type phase: SQRT_DT_RAY_* owned; sqrt_dt → Ray signature hole (define next).
No Eff. No Weiner/Shock bodies.
"""

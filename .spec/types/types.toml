  "mulDiv(v1,v2,PIPS) ∉ u16 ⇒ revert (⊥)",
  "Eff = []",
]
refined = false
notes = """
#27 type/Pips. v1: intro takes untyped u256×u256 (IMPROVE → Ray × mag later).
PIPS = 1e6 Algebra FEE_DENOMINATOR. No Eff. No Weiner/Shock bodies.
First .btt (define): success fit-u16 + invalid overflow revert.
"""
